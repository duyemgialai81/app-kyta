name: Mobile EAS Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-eas-build.yml'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Nền tảng build'
        required: true
        default: 'android'
        type: choice
        options: [android, ios, all]
      profile:
        description: 'Build profile (eas.json)'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production, development]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cắt khoảng trắng / xuống dòng bị dính khi dán token vào GitHub Secrets,
      # rồi xuất EXPO_TOKEN đã làm sạch cho các bước sau.
      - name: Check EXPO_TOKEN
        env:
          RAW_EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          CLEAN="$(printf '%s' "$RAW_EXPO_TOKEN" | tr -d '[:space:]')"
          if [ -z "$CLEAN" ]; then
            echo "::error::Chưa có secret EXPO_TOKEN. Vào Settings > Secrets and variables > Actions để thêm."
            exit 1
          fi
          if printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^A-Za-z0-9_.-]'; then
            echo "::warning::EXPO_TOKEN có ký tự lạ — kiểm tra lại có lỡ dán ngoặc kép, 'Bearer ' hay 'EXPO_TOKEN=' không."
          fi
          echo "::add-mask::$CLEAN"
          echo "EXPO_TOKEN=$CLEAN" >> "$GITHUB_ENV"
          echo "Token OK (độ dài ${#CLEAN} ký tự)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Cài eas-cli bằng npm thay cho expo/expo-github-action (bản v8 cài bằng yarn bị lỗi)
      - name: Install EAS CLI
        run: npm install -g eas-cli@latest && eas --version

      - name: Install dependencies
        run: npm ci

      - name: Check Expo login
        run: eas whoami

      # Tự tạo/liên kết project EAS (@<tài khoản của EXPO_TOKEN>/fpt-is-mobile) nếu app.json chưa có projectId
      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: EAS Build
        run: |
          eas build \
            --platform ${{ github.event.inputs.platform || 'android' }} \
            --profile ${{ github.event.inputs.profile || 'preview' }} \
            --non-interactive \
            --no-wait
